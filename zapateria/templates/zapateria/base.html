<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zapatería{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        nav { background: #222; color: white; padding: 12px 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        nav a { color: #eee; text-decoration: none; }
        nav a:hover { color: #fff; text-decoration: underline; }
        .container { max-width: 960px; margin: 20px auto; padding: 0 15px; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 10px; margin-bottom: 8px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        th { background: #333; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .btn { display: inline-block; padding: 6px 12px; margin: 2px; background: #333; color: white; text-decoration: none; border-radius: 3px; border: none; cursor: pointer; }
        .btn:hover { background: #555; }
        .btn-danger { background: #c0392b; }
        .btn-danger:hover { background: #a93226; }
        form p { margin-bottom: 12px; }
        form label { display: block; font-weight: bold; margin-bottom: 4px; }
        form input, form select, form textarea { width: 100%; max-width: 400px; padding: 6px; box-sizing: border-box; }
        .actions { margin-top: 15px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}"><strong>Zapatería</strong></a>
        <a href="{% url 'categoria_list' %}">Categorías</a>
        <a href="{% url 'marca_list' %}">Marcas</a>
        <a href="{% url 'producto_list' %}">Productos</a>
        <a href="{% url 'venta_list' %}">Ventas</a>
        <span style="margin-left:auto;"></span>
        {% if user.is_authenticated %}
            <span>Hola, {{ user.username }}</span>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn" style="background:transparent;border:1px solid #aaa;">Salir</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Entrar</a>
            <a href="{% url 'registro' %}">Registrarse</a>
        {% endif %}
    </nav>

    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
