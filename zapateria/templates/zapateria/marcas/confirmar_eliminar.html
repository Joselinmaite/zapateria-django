{% extends 'zapateria/base.html' %}

{% block title %}Eliminar marca{% endblock %}

{% block content %}
<h1>Eliminar marca</h1>
<p>¿Seguro que quieres eliminar la marca <strong>{{ marca.nombre }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a class="btn" href="{% url 'marca_detail' marca.pk %}">Cancelar</a>
</form>
{% endblock %}
