{% extends 'zapateria/base.html' %}

{% block title %}Registro{% endblock %}

{% block content %}
<h1>Crear cuenta</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button type="submit" class="btn">Registrarse</button>
    </div>
</form>

<p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
{% endblock %}
